# https://fleet.rancher.io/ref-fleet-yaml
defaultNamespace: cattle-kubewarden-system

# Keep deployed resources when this bundle is removed, to migrate them
# to the new consolidated admission-controller chart.
keepResources: true

helm:
  version: "*-0" # 2.0.5
  releaseName: rancher-kubewarden-controller
  chart: kubewarden-controller
  repo: https://charts.kubewarden.io
  values:
    # image:
    #   tag: latest
    auditScanner:
      # Disable the policy-reporter subchart before the migration to the
      # admission-controller chart: its Deployments embed the Helm release
      # name in the immutable spec.selector, so they cannot be adopted by
      # the new release (takeOwnership). Removing them here lets the new
      # chart recreate them fresh.
      policyReporter: false
      cronJob:
        schedule: "*/1 * * * *" # every minute
    telemetry:
      mode: sidecar
      tracing: true
      sidecar:
        # metrics:
        # enabled: true
        # port: 8080
        tracing:
          jaeger:
            endpoint: "jaeger-operator-jaeger-collector.jaeger.svc.cluster.local:4317"
            tls:
              insecure: true

diff:
  comparePatches:
    - apiVersion: opentelemetry.io/v1alpha1
      kind: OpenTelemetryCollector
      name: kubewarden
      namespace: cattle-kubewarden-system
      operations:
        - { "op": "remove", "path": "/spec" }

    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      name: kubewarden-controller-mutating-webhook-configuration
      jsonPointers:
      operations:
        - { "op": "remove", "path": "/webhooks" }

    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      name: kubewarden-controller-validating-webhook-configuration
      operations:
        - { "op": "remove", "path": "/webhooks" }

labels:
  app: rancher-kubewarden-controller

dependsOn:
  - selector:
      matchLabels:
        app: rancher-kubewarden-crds
  - selector:
      matchLabels:
        name: opentelemetry
  - selector:
      matchLabels:
        name: jaeger-operator
